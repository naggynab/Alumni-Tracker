{% extends "base.html" %}
{% block title %}Reset Link Sent{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4z"/></svg>
        </div>
        <h1>Check Your Email</h1>
        <p>We've sent a password reset link to the recovery email you provided during registration. If you don't see it, please check your spam folder.</p>
    </div>

    <a class="btn btn-primary btn-block" href="{% url 'account_login' %}" style="text-decoration:none;text-align:center">
        Back to Sign In
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    </a>
  </div>
</div>
{% endblock %}
