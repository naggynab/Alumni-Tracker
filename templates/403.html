{% extends "base.html" %}
{% block title %}Access Restricted{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </div>
        <h1>Access Restricted</h1>
        <p>{% if exception %}{{ exception }}{% else %}You do not have permission to view this page.{% endif %}</p>
    </div>

    <a class="btn btn-primary btn-block" href="{% url 'directory:my-profile' %}" style="text-decoration:none;text-align:center">
        Back to My Profile
    </a>
  </div>
</div>
{% endblock %}
