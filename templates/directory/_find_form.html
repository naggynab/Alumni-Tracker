{% comment %}Shared "Find Alumni" search form. Expects `filter`
(AlumnusFilter).{% endcomment %}
<form method="get" action="{% url 'directory:alumni-list' %}">
  <div class="field-mb">
    <label for="{{ filter.form.name.id_for_label }}">Roll Number / Alumni Search</label>
    <div class="input-icon">
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      {{ filter.form.name }}
    </div>
  </div>

  <div class="find-divider"></div>

  <div class="form-grid">
    <div>
      <label for="{{ filter.form.batch.id_for_label }}">Graduation Batch</label>
      {{ filter.form.batch }}
    </div>
    <div>
      <label for="{{ filter.form.field_of_study.id_for_label }}"
        >Program / Department</label
      >
      {{ filter.form.field_of_study }}
    </div>
    <div>
      <label for="{{ filter.form.country.id_for_label }}">Country</label>
      {{ filter.form.country }}
    </div>
    <div>
      <label for="{{ filter.form.current_city.id_for_label }}">City</label>
      {{ filter.form.current_city }}
    </div>
    <div>
      <label for="{{ filter.form.employer.id_for_label }}"
        >Search by Organization</label
      >
      {{ filter.form.employer }}
    </div>
    <div>
      <label for="{{ filter.form.university.id_for_label }}"
        >Search by University</label
      >
      {{ filter.form.university }}
    </div>
  </div>

  <div class="find-actions">
    <button class="btn btn-primary" type="submit">Search</button>
    <a class="btn btn-light" href="{% url 'directory:alumni-list' %}">Reset</a>
  </div>
</form>

<script>
  (function () {
    const optionsUrl = "{% url 'directory:alumni-filter-options' %}";
    const countrySelect = document.getElementById(
      "{{ filter.form.country.id_for_label }}",
    );
    const citySelect = document.getElementById(
      "{{ filter.form.current_city.id_for_label }}",
    );
    const universitySelect = document.getElementById(
      "{{ filter.form.university.id_for_label }}",
    );

    if (!countrySelect || !citySelect || !universitySelect) {
      return;
    }

    function setOptions(select, options, placeholder, emptyMessage, preferredValue) {
      const selected = preferredValue === undefined ? select.value : preferredValue;
      select.innerHTML = "";

      const emptyOption = document.createElement("option");
      emptyOption.value = "";
      emptyOption.textContent = placeholder;
      select.appendChild(emptyOption);

      options.forEach(function (optionData) {
        const option = document.createElement("option");
        option.value = optionData.value;
        option.textContent = optionData.label;
        select.appendChild(option);
      });

      if (options.some(function (optionData) {
        return optionData.value === selected;
      })) {
        select.value = selected;
      } else {
        select.value = "";
      }

      if (!options.length && emptyMessage) {
        const messageOption = document.createElement("option");
        messageOption.disabled = true;
        messageOption.textContent = emptyMessage;
        select.appendChild(messageOption);
      }
    }

    function setLoading(select, placeholder, message) {
      select.innerHTML = "";
      const option = document.createElement("option");
      option.value = "";
      option.textContent = message || placeholder;
      select.appendChild(option);
      select.disabled = true;
      select.setAttribute("aria-busy", "true");
    }

    function setReady(select) {
      select.disabled = false;
      select.removeAttribute("aria-busy");
    }

    function setError(select, placeholder, message) {
      select.innerHTML = "";
      const placeholderOption = document.createElement("option");
      placeholderOption.value = "";
      placeholderOption.textContent = placeholder;
      select.appendChild(placeholderOption);
      const errorOption = document.createElement("option");
      errorOption.disabled = true;
      errorOption.textContent = message;
      select.appendChild(errorOption);
      select.value = "";
      setReady(select);
    }

    async function loadOptions(countryCode, updateAll) {
      const selectedCountry = countrySelect.value;
      const selectedCity = citySelect.value;
      const selectedUniversity = universitySelect.value;
      const url = new URL(optionsUrl, window.location.origin);
      if (countryCode) {
        url.searchParams.set("country", countryCode);
      }

      if (updateAll) {
        setLoading(countrySelect, "Select Country", "Loading countries...");
        setLoading(universitySelect, "Select University", "Loading universities...");
      }
      setLoading(citySelect, "Select City", countryCode ? "Loading cities..." : "Select City");

      try {
        const response = await fetch(url.toString(), {
          headers: { "X-Requested-With": "XMLHttpRequest" },
        });
        if (!response.ok) {
          throw new Error("filter options request failed");
        }
        const data = await response.json();

        if (updateAll) {
          setOptions(countrySelect, data.countries || [], "Select Country", "No countries available", selectedCountry);
          setOptions(universitySelect, data.universities || [], "Select University", "No universities available", selectedUniversity);
          setReady(countrySelect);
          setReady(universitySelect);
        }
        setOptions(citySelect, data.cities || [], "Select City", countryCode ? "No cities available" : "", countryCode ? selectedCity : "");
        setReady(citySelect);
      } catch (error) {
        if (updateAll) {
          setError(countrySelect, "Select Country", "Unable to load countries. Please try again.");
          setError(universitySelect, "Select University", "Unable to load universities. Please try again.");
        }
        setError(citySelect, "Select City", "Unable to load cities. Please try again.");
      }
    }

    countrySelect.addEventListener("change", function () {
      citySelect.value = "";
      loadOptions(countrySelect.value, false);
    });

    loadOptions(countrySelect.value, true);
  })();

  (function () {
    function addTypeAhead(select) {
      if (!select) {
        return;
      }
      let buffer = "";
      let resetTimer;
      select.addEventListener("keydown", function (event) {
        if (event.key.length !== 1 || event.ctrlKey || event.altKey || event.metaKey) {
          return;
        }
        buffer += event.key.toLowerCase();
        clearTimeout(resetTimer);
        resetTimer = setTimeout(function () {
          buffer = "";
        }, 700);
        const match = Array.from(select.options).find(function (option) {
          return option.textContent.toLowerCase().includes(buffer);
        });
        if (match) {
          select.value = match.value;
        }
      });
    }

    addTypeAhead(document.getElementById("{{ filter.form.current_city.id_for_label }}"));
    addTypeAhead(document.getElementById("{{ filter.form.university.id_for_label }}"));
  })();
</script>
