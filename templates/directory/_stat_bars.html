{% load humanize %}
{% if rows %}
<ul class="bar-list">
    {% for row in rows %}
    <li class="bar-row">
        <span class="bar-label" title="{{ row.label }}">
            {{ row.label }}{% if row.sub %}<em>{{ row.sub }}</em>{% endif %}
        </span>
        <span class="bar-track"><span class="bar-fill" style="width:{{ row.bar }}%"></span></span>
        <span class="bar-val">{{ row.total|intcomma }}<em>{{ row.share }}%</em></span>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="bar-empty">No records match this selection.</p>
{% endif %}
