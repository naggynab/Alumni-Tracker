databases:
  - name: alumni-tracker-db
    plan: free
    databaseName: alumni_tracker

services:
  - type: web
    name: alumni-tracker
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn alumni_tracker.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alumni-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "thapanabina.com.np,www.thapanabina.com.np,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://thapanabina.com.np,https://www.thapanabina.com.np"
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
